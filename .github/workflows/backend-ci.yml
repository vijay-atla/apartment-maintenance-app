name: backend-ci

on:
  push:
    branches: [ develop ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ develop ]
    paths:
      - "backend/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 👇 add these two steps
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Normalize line endings for mvnw (Windows-safe)
        run: sed -i 's/\r$//' mvnw

      - name: Build & Test
        run: ./mvnw -B verify
